<!--
  The shape of the live KDP Kindle eBook details step (title-setup/kindle/<ASIN>/details),
  CONFIRMED 7 Oct 2026. Only the parts kdp-retitle reads are kept. The title and subtitle are
  plain text inputs found by NAME; there is no data-title / data-subtitle id or attribute.
-->
<form id="details-form">
  <label for="title-field">Book Title</label>
  <input type="text" class="a-input-text" name="data[title]" maxlength="200" value="The Gift Letter">
  <label for="subtitle-field">Subtitle (Optional)</label>
  <input type="text" class="a-input-text" name="data[subtitle]" maxlength="200" value="">
  <input type="text" name="data[series_title]" value="">
  <span id="save-and-continue-announce">Save and Continue</span>
</form>
