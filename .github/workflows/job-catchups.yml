name: job · Catch up with · daily 06:20 CT

# Who is worth a catch-up, for the morning email's "Catch up with" (the morning sections store; Monique's
# deals section is read from Boss OS). Moved off her Mac 1 Nov 2026 (was launchd com.seq.boss-catchups,
# same daily 06:20 Central). Same command as launchd ran.
#
# FIRED BY BOSS OS'S OWN CLOCK, NOT GITHUB'S (21 Nov 2026). GitHub's `schedule` event is best effort
# and from about 17 Nov fired this account's workflows once every 6-9 hours, so the 21 Nov morning
# email was never built. The Worker's five-minute cron reads this job's times from its Schedule row
# (src/shared/boss/schedule/manifest.json, trigger.clock "worker") and sends the repository_dispatch
# below (src/worker/boss/cron/dispatch.ts). No `schedule:` here: one clock, never two.
on:
  repository_dispatch:
    types: [job-catchups]
  workflow_dispatch:
    inputs:
      dry:
        description: "Proof run: reads everything, records and writes nothing (no duty row)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: job-catchups
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/cloud-job.yml
    secrets: inherit
    with:
      job: catchups
      timeout: 15
      command: ${{ inputs.dry && 'npm run --silent lp:catchups -- --dry' || 'bash scripts/ops/duty-run.sh lp-catchups.mjs -- npm run --silent lp:catchups' }}
