name: job · your-day cloud comparison (dry, sends nothing)

# THE CUTOVER PROOF for Simone's morning email (1 Nov 2026, the Mac→cloud move): builds the morning
# on a runner from the Boss OS morning sections store and prints it to the PRIVATE R2 log only
# (`your-day --dry-run`: nothing is sent, nothing is posted, no duty row). Compared against the Mac's
# own dry build before your-day itself moves; dispatch only, never scheduled.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-your-day-compare
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/cloud-job.yml
    secrets: inherit
    with:
      job: your-day-compare
      state: your-day
      timeout: 15
      command: npm run --silent your-day -- --dry-run --no-wait
