name: job · Zora's waiting-on register · daily 07:00 CT

# Zora's register: an item due today is opened as a task for its owner; a measurement adds one line to the
# morning email through the Boss OS morning sections store. Moved off her Mac 1 Nov 2026 (was launchd
# com.seq.boss-waiting-on, same daily 07:00 Central). Same command as launchd ran.
#
# FIRED BY BOSS OS'S OWN CLOCK, NOT GITHUB'S (21 Nov 2026). GitHub's `schedule` event is best effort
# and from about 17 Nov fired this account's workflows once every 6-9 hours, so the 21 Nov morning
# email was never built. The Worker's five-minute cron reads this job's times from its Schedule row
# (src/shared/boss/schedule/manifest.json, trigger.clock "worker") and sends the repository_dispatch
# below (src/worker/boss/cron/dispatch.ts). No `schedule:` here: one clock, never two.
on:
  repository_dispatch:
    types: [job-waiting-on]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-waiting-on
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/cloud-job.yml
    secrets: inherit
    with:
      job: waiting-on
      timeout: 15
      command: bash scripts/ops/duty-run.sh waiting-on.mjs -- npm run --silent waiting-on
