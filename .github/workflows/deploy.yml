# Boss OS — production deploy, on a green FULL E2E run of `main`, without a person in the loop.
#
# WHY THIS EXISTS, AND WHY IT REVERSES A DELIBERATE DECISION.
#
# `ci.yml` records the August 2026 decision NOT to deploy from CI: Workers Builds
# was connected on 14 Aug and switched off on 18 Aug because auto-deploy-on-push
# cannot run the safe migrate-then-deploy sequence without a long-lived Cloudflare
# API token with D1 write access living in the CI environment. That reasoning was
# sound and the token's blast radius is real.
#
# The owner overrode it on 18 Sep 2026, in those words, after four PRs were merged
# and none were deployed and she opened the app to find a redesign that had been on
# `main` for an hour and was not in production. She supplied the token herself and
# said the trade was hers to make. It is.
#
# BUILD FIRST, TEST IN BATCHES (26 Sep 2026). Until now this fired on `CI`, whose run on main
# included the 15–17-minute Playwright journeys, so every merge waited on them before shipping.
# The journeys moved to `e2e.yml` (workflow_dispatch ONLY — owner, 2 Oct 2026; the weekly Sunday
# cron of 26 Sep is retired) and this workflow fires on THAT run's success, checking out the exact
# sha it passed on. A merge lands on main at once; production moves when someone, or `land` after
# a large change, dispatches e2e on main's head and it goes green — `land --promote boss-os
# --run-e2e` is the path after a batch of merges. Every deploy here is recorded as a GitHub
# Deployment (environment `production`), which is what `land --promote` reads to know what
# production runs.
#
# WHAT MAKES THIS SAFE ENOUGH TO BE WORTH IT:
#   · It runs ONLY after `e2e` has completed successfully, and ONLY on `main`. A red
#     e2e run deploys nothing and is fixed first (bisect from the last green sha).
#   · It runs `npm run deploy:production`, which applies migrations, verifies none
#     are pending, builds, deploys, and probes the worker. Never a bare
#     `wrangler deploy`: that ships a stale client and the LOCAL DEV bindings, and
#     on 17 Sep it tried to push `WP_OS_ENV "local"` and a dev passcode to prod.
#   · `concurrency` with no cancel-in-progress: two runs in quick succession
#     deploy in order rather than racing, and a half-applied migration set is never
#     interrupted by the next run.
#
# `land` (in ~/bin) remains the operator path and does the same checks from a
# laptop. This workflow is the belt; `land` is the braces.
name: Deploy

on:
  workflow_run:
    workflows: [e2e]
    types: [completed]
    branches: [main]
  workflow_dispatch: # break-glass: deploys main's head WITHOUT the e2e verdict; prefer `land --promote boss-os --run-e2e`

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    # A `workflow_run` fires on failure too. Deploying a commit the journeys failed on is the
    # exact accident this is meant to prevent, so the gate is explicit.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write # the production record `land --promote` reads

    steps:
      - name: Checkout the exact commit the e2e run proved
        uses: actions/checkout@v4
        with:
          # Deploy what was validated, not whatever `main` has drifted to since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 24, to match ci.yml and `engines`. NOT 22: `validate:ci-npm-parity`
          # rejected that, correctly — node 22 ships npm 10, `engines.npm` declares
          # 11, and npm 10 refuses a lock npm 11 wrote ("Missing: ... from lock
          # file") before a single step runs. The guard caught this workflow on its
          # first CI run, which is what it is for.
          node-version: 24
          cache: npm

      - name: Install (reproducible, from package-lock)
        run: npm ci

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Without this, wrangler returns a 7403 that reads like a revoked token
          # and is not one. It cost a deploy on 18 Sep 2026.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:production

      # One GitHub Deployment per production deploy (environment `production`), the same record
      # `land` writes from a laptop. `land --promote` reads the newest one to know what production
      # runs; without it a scheduled deploy here would be invisible to the operator path.
      - name: Record the production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          NOTE: ${{ github.event_name == 'workflow_dispatch' && 'deploy.yml workflow_dispatch (no e2e verdict)' || 'deploy.yml on green e2e' }}
        run: |
          id="$(printf '{"ref":"%s","environment":"production","auto_merge":false,"required_contexts":[],"description":"%s","production_environment":true}' "$SHA" "$NOTE" \
                 | gh api -X POST "repos/${GITHUB_REPOSITORY}/deployments" --input - --jq .id)"
          printf '{"state":"success","environment":"production","description":"%s","environment_url":"https://boss.sequoiataylor.com"}' "$NOTE" \
                 | gh api -X POST "repos/${GITHUB_REPOSITORY}/deployments/$id/statuses" --input - >/dev/null
          echo "Deployed $SHA to production ($NOTE); GitHub deployment $id." >> "$GITHUB_STEP_SUMMARY"
