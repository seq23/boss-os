# Boss OS — production deploy from CI: on a green FULL E2E run of `main`, or on a dispatch the
# production gate passes. Without a person in the loop.
#
# WHY THIS EXISTS, AND WHY IT REVERSES A DELIBERATE DECISION.
#
# `ci.yml` records the August 2026 decision NOT to deploy from CI: Workers Builds
# was connected on 14 Aug and switched off on 18 Aug because auto-deploy-on-push
# cannot run the safe migrate-then-deploy sequence without a long-lived Cloudflare
# API token with D1 write access living in the CI environment. That reasoning was
# sound and the token's blast radius is real.
#
# The owner overrode it on 18 Sep 2026, in those words, after four PRs were merged
# and none were deployed and she opened the app to find a redesign that had been on
# `main` for an hour and was not in production. She supplied the token herself and
# said the trade was hers to make. It is.
#
# BUILD FIRST, TEST IN BATCHES (26 Sep 2026). Until now this fired on `CI`, whose run on main
# included the 15–17-minute Playwright journeys, so every merge waited on them before shipping.
# The journeys moved to `e2e.yml` (workflow_dispatch ONLY — owner, 2 Oct 2026; the weekly Sunday
# cron of 26 Sep is retired) and this workflow fires on THAT run's success, checking out the exact
# sha it passed on. Every deploy here is recorded as a GitHub Deployment (environment
# `production`), which is what `land` reads to know what production runs.
#
# SMALL CHANGES SHIP ON THE FAST CHECK (owner, 2 Oct 2026, asked and answered). With the journeys
# on demand only, a small change waited for a 17-minute suite nothing would start. Now:
#   · A SMALL change is deployed by `land <pr>` from the laptop as soon as `CI` is green on the
#     merge commit (`npm run deploy:production` in a clean worktree at that sha, recorded as
#     "small change: N lines, M files; shipped on the fast check, e2e on demand").
#   · After a LARGE change `land` dispatches e2e on main's head, and this workflow fires on that
#     run's success; `land` waits for this run instead of deploying the same sha beside it.
#   · "Large" is defined once, in the `large` block of `land` (seq23/seq-bin) — not here.
#   · workflow_dispatch is the same rule without a laptop, and NO LONGER a way round it: it used
#     to deploy main's head with no verdict at all. Now it takes a `sha` and a `reason` and is
#     REFUSED unless that sha has a green e2e run, or — with a reason, land's small-change
#     verdict — `CI` is green on exactly that sha and the journeys are not known red on main.
# The rule is `scripts/deploy/production-gate.mjs`, run below for EVERY path; this file restates
# none of it, and `scripts/validate/production-moves-only-through-the-gate.mjs` fails the build
# if a path stops going through it. Break-glass is `npm run deploy:production` from the laptop.
#
# WHAT MAKES THIS SAFE ENOUGH TO BE WORTH IT:
#   · It runs ONLY for a sha the production gate passes, and ONLY on `main`. A red
#     e2e run deploys nothing, blocks every small change until a green run is newer, and is fixed
#     first (bisect from the last green sha).
#   · It runs `npm run deploy:production`, which applies migrations, verifies none
#     are pending, builds, deploys, and probes the worker. Never a bare
#     `wrangler deploy`: that ships a stale client and the LOCAL DEV bindings, and
#     on 17 Sep it tried to push `WP_OS_ENV "local"` and a dev passcode to prod.
#   · `concurrency` with no cancel-in-progress: two runs in quick succession
#     deploy in order rather than racing, and a half-applied migration set is never
#     interrupted by the next run.
#
# `land` (in ~/bin) remains the operator path and does the same checks from a
# laptop. This workflow is the belt; `land` is the braces.
name: Deploy

on:
  workflow_run:
    workflows: [e2e]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to deploy to production (default: main's head)."
        required: false
        default: ""
      reason:
        description: "Why it may ship without a green e2e run on it: land's small-change verdict. Empty = a green e2e run on the sha is required."
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    # A `workflow_run` fires on failure too. Deploying a commit the journeys failed on is the
    # exact accident this is meant to prevent, so the gate is explicit.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # the gate reads e2e and CI runs
      deployments: write # the production record `land` reads

    steps:
      - name: Checkout main (the gate script, and the history the sha must be on)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the sha and pass the production gate (every path)
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ github.event.inputs.sha }}
          REASON: ${{ github.event.inputs.reason }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_run ]; then sha="$RUN_SHA"; else sha="$(git rev-parse "${INPUT_SHA:-origin/main}")"; fi
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$sha is not on main"; exit 1; }
          SHA="$sha" node scripts/deploy/production-gate.mjs | tee -a "$GITHUB_STEP_SUMMARY"
          # `land` deploys a small change from the laptop and records it; a later green e2e on that
          # same sha must not migrate-and-deploy it a second time.
          live="$(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=production&per_page=1" --jq '.[0].sha // empty')"
          if [ "$live" = "$sha" ]; then
            echo "production already runs $sha (GitHub deployment record); nothing to deploy" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Deploy what the gate passed, not whatever `main` has drifted to since.
      - name: Check out exactly that sha
        if: steps.pick.outputs.skip != 'true'
        run: git checkout -q "${{ steps.pick.outputs.sha }}"

      - name: Set up Node
        if: steps.pick.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          # 24, to match ci.yml and `engines`. NOT 22: `validate:ci-npm-parity`
          # rejected that, correctly — node 22 ships npm 10, `engines.npm` declares
          # 11, and npm 10 refuses a lock npm 11 wrote ("Missing: ... from lock
          # file") before a single step runs. The guard caught this workflow on its
          # first CI run, which is what it is for.
          node-version: 24
          cache: npm

      - name: Install (reproducible, from package-lock)
        if: steps.pick.outputs.skip != 'true'
        run: npm ci

      - name: Deploy
        if: steps.pick.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Without this, wrangler returns a 7403 that reads like a revoked token
          # and is not one. It cost a deploy on 18 Sep 2026.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:production

      # One GitHub Deployment per production deploy (environment `production`), the same record
      # `land` writes from a laptop. `land --promote` reads the newest one to know what production
      # runs; without it a scheduled deploy here would be invisible to the operator path.
      - name: Record the production deployment
        if: steps.pick.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pick.outputs.sha }}
          GATE: ${{ steps.pick.outputs.note }}
        run: |
          set -euo pipefail
          # The gate's own sentence is the note (which path let this sha through). The gate emits it
          # as one line of plain ASCII with no quotes or backslashes, so it is safe inside the JSON
          # below; cut here to stay inside GitHub's 140-character description.
          NOTE="deploy.yml: ${GATE:0:110}"
          id="$(printf '{"ref":"%s","environment":"production","auto_merge":false,"required_contexts":[],"description":"%s","production_environment":true}' "$SHA" "$NOTE" \
                 | gh api -X POST "repos/${GITHUB_REPOSITORY}/deployments" --input - --jq .id)"
          printf '{"state":"success","environment":"production","description":"%s","environment_url":"https://boss.sequoiataylor.com"}' "$NOTE" \
                 | gh api -X POST "repos/${GITHUB_REPOSITORY}/deployments/$id/statuses" --input - >/dev/null
          echo "Deployed $SHA to production ($NOTE); GitHub deployment $id." >> "$GITHUB_STEP_SUMMARY"
