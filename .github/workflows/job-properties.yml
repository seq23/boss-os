name: job · Spry heartbeat and properties · wed 06:45 CT

# Camille's weekly read of the Spry Labs sites: the heartbeat (gh reads of each repo) and the Search
# Console movement week over week. Moved off her Mac 1 Nov 2026 (was launchd com.seq.boss-properties,
# same Wednesday 06:45 Central). Same commands as launchd ran.
#
# FIRED BY BOSS OS'S OWN CLOCK, NOT GITHUB'S (21 Nov 2026). GitHub's `schedule` event is best effort
# and from about 17 Nov fired this account's workflows once every 6-9 hours, so the 21 Nov morning
# email was never built. The Worker's five-minute cron reads this job's times from its Schedule row
# (src/shared/boss/schedule/manifest.json, trigger.clock "worker") and sends the repository_dispatch
# below (src/worker/boss/cron/dispatch.ts). No `schedule:` here: one clock, never two.
on:
  repository_dispatch:
    types: [job-properties]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-properties
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/cloud-job.yml
    secrets: inherit
    with:
      job: properties
      timeout: 20
      command: npm run --silent spry:heartbeat; npm run --silent properties
