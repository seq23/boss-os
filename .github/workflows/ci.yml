# West Peek OS — continuous validation.
#
# Runs the repo's FAST gate (typecheck, unit/integration tests, every static validator, the
# client build) on every push and pull request against `main`. The Playwright journeys are not
# here: they live in `e2e.yml` (nightly + on dispatch) and gate PRODUCTION, not the merge.
#
# ─── THE SHAPE (21 Sep 2026; build first, test in batches 26 Sep 2026) ─────────
#
# The MERGE GATE — what a pull request waits on — is the fast half, run as parallel jobs:
# typecheck + every registered scan + the client build in one job, the unit/integration suite in
# four vitest shards, the Boss suites in three. Measured on run 35648912898 the single serial job took
# 15m02s (unit 7m55s, Boss 5m00s, scans 0m57s, install+typecheck 0m42s); sharded, the longest
# job is a quarter of the unit suite plus setup, so the gate finishes in about 3–4 minutes.
#
# The Playwright journeys — 15–17 minutes, one worker, one shared local D1 — used to run here on
# `main` after every merge, and `Deploy` fired on this workflow. From 26 Sep 2026 they run once a
# night (07:00 UTC) and on demand in `e2e.yml`, and `Deploy` fires on THAT workflow's success: a
# merge lands on main at once, production moves only to a commit the journeys have passed
# (`land --promote boss-os` ships the newest such commit by hand). `land <pr>` watches this run.
#
# Every job carries `timeout-minutes` at about twice its normal wall time, so a hang is reported as
# a hang inside the hour rather than as a six-hour default.
#
# Deliberately NOT in this workflow: a deploy step. BACKLOG.md records the decision already made
# here — Cloudflare Workers Builds was connected on 14 Aug 2026 and switched off on 18 Aug 2026,
# on purpose, because auto-deploy-on-push cannot run the safe migrate-then-deploy sequence
# (`npm run deploy:production`) without a long-lived Cloudflare API token with D1 write access
# living in the CI environment — real blast radius, for a firm that deploys from one laptop.
# GitHub is source history and a validation gate. It is not the deploy mechanism.
#
# Also NOT here: `validate:value-shapes`. It queries production D1 directly
# (`wrangler d1 execute --remote`) and needs the same production credentials this workflow
# deliberately does not hold. It stays a pre-deploy, operator-run check (docs/DEPLOYING.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, scans, and client build
    runs-on: ubuntu-latest
    # Normal: ~2m30s (install 0m16s, typecheck 0m26s, scans 0m57s, named scans ~0m15s, build 0m04s).
    timeout-minutes: 6
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (reproducible, from package-lock)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The governance boundary scans are part of the gate, not optional extras: they are what
      # keep authority, the AI boundary, cross-repo isolation, brand, design tokens, CSS
      # coverage, and SQL-against-schema honest. Each has its own self-test — a validator that
      # cannot demonstrate it still catches what it exists to catch does not run here.
      # ─── EVERY REGISTERED SCAN, AS ONE STEP ───────────────────────────────
      #
      # THE HOLE THIS CLOSES, found by a red CI run on 13 Sep 2026. `npm run validate` chained 49
      # scans and this file named 19 — and the two sets were not nested in either direction. Nine
      # scans ran ONLY here, so a green local run could push a red build (`validate:brand` caught a
      # `#000` in the stylesheet that `npm run validate` never looked at). And THIRTY-EIGHT ran only
      # locally, so a contributor who did not run the chain by hand could land a change that broke
      # any of them with CI green.
      #
      # `validate:scans` is now the union, so the command the documentation calls the gate IS the
      # gate. The named steps below are kept because a failure line that says "Brand system" is
      # worth more at 7am than one that says "All registered scans", and they are a subset of this
      # step rather than a second list.
      - name: All registered scans
        run: npm run validate:scans

      - name: Authority boundary
        run: npm run validate:authority

      - name: AI boundary
        run: npm run validate:ai-boundary

      - name: Network boundary
        run: npm run validate:network-boundary

      - name: Brand system
        run: npm run validate:brand

      - name: Design tokens
        run: npm run validate:design-tokens

      - name: CSS class coverage
        run: npm run validate:css-classes

      - name: Every var(--token) resolves
        run: npm run validate:css-variables

      - name: Lists speak while loading
        run: npm run validate:lists-speak

      - name: Every Boss entity is classified
        run: npm run validate:classification

      - name: SQL against schema
        run: npm run validate:sql

      # Ratcheted. A backend that works and cannot be reached from the interface is
      # indistinguishable, from the owner's chair, from one that does not work.
      - name: Every endpoint has a way in
        run: npm run validate:api-screens

      # A row that cannot say why it is on her screen comes off the screen. Guards the Capital
      # desk's ranking: every point awarded quotes the fact that earned it, every firm held back
      # leaves with a reason, and all of it is actually bound in the page.
      - name: A recommendation says why
        run: npm run validate:says-why

      # One browser launcher, shared by every employee — and no prompt telling an employee that
      # anything behind a login is impossible while the capability exists.
      - name: Every employee can open a browser
        run: npm run validate:shared-browser

      # Eight of the fifteen decisions in the production approvals table were not decisions. A
      # screen that asks for a verdict on things with no verdict devalues the ones that have one.
      - name: A notice is not an approval
        run: npm run validate:notice-not-approval

      # `internal_memo` shipped in 0014 with a create action, two routes and an append-only
      # trigger, holds zero rows, and is read by nothing. A noticeboard in a room nobody walks
      # through. This one runs the real buildPrompt against the rows the migrations seed.
      - name: A notice reaches the employee
        run: npm run validate:notice-reaches-employee

      # Three components on the Spirit tab disagreed about whether there was a new moon tomorrow.
      # The almanac computes it; nothing on a screen may claim otherwise from an empty array.
      - name: One sky, one answer
        run: npm run validate:one-sky

      # Today's Contract rendered its four pillar headers LIGHTER than their own content. An
      # inverted hierarchy is invisible to every other test in this repository.
      - name: A heading outranks its content
        run: npm run validate:heading-rank

      # She can read staylor@spry.vc and can never send from it. Her mailbox at a FINRA-registered
      # broker-dealer: reading it is a private convenience, writing from it would be an unsupervised
      # communication from a regulated person. Three separate things already make it impossible and
      # none of them was written down, which is a rule with a six-month expiry.
      - name: Monique reads spry.vc and never sends from it
        run: npm run validate:no-spry-sender

      # "it should never send — the green button should be to create the draft." (19 Sep 2026.)
      # The inbox letter card has one primary action and it makes a Gmail draft; none of the files
      # her press reaches imports a transport or names a send endpoint. The chassis carries three
      # working transports one import away, which is why this is a scan and not a comment.
      - name: The inbox draft never sends
        run: npm run validate:inbox-draft

      # A filter over 104,241 messages whose discard is one number is a filter nobody can audit, and
      # an unauditable filter loses deals silently. Every message ends in a named bucket, a 100%
      # discard is a named stop, and a company name entering the filter fails the build.
      - name: The filter says what it dropped
        run: npm run validate:filter-accounts

      # A stale block is not live inventory. `transacted` is a durable fact about a PERSON - it is
      # why a buyer's mandate never expires - and it once returned an infinite half-life on the sell
      # side too, so eleven blocks sold in March 2026 crossed against fresh buyers as live supply.
      # The other half of the rule is asserted here as well: outreach keeps reaching back with no
      # cutoff, so decaying a cross can never be widened into a blanket age filter.
      - name: A stale block is not live inventory
        run: npm run validate:capital-staleness

      - name: Build client
        run: npm run build

  unit:
    name: Unit and integration tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Normal: ~2m30s a shard (7m55s serial on 21 Sep 2026, split four ways, plus install).
    timeout-minutes: 6
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (reproducible, from package-lock)
        run: npm ci

      # `--shard` splits the FILE list across the matrix; `--no-file-parallelism` keeps each shard
      # serial inside, because these suites share a miniflare per file and were never written to
      # run beside each other. Four shards, one runner each: the parallelism is between jobs.
      - name: Unit and integration tests
        run: npx vitest run --no-file-parallelism --shard=${{ matrix.shard }}/4

  boss:
    name: Boss OS suites (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Normal: ~3–4m a shard. Two shards split 81 files 41/40 but 811/696 tests: shard 2 took 7m37s
    # on run 35653650867 while shard 1 took 3m. Three shards keep the longest under the gate's target.
    timeout-minutes: 8
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (reproducible, from package-lock)
        run: npm ci

      # THE BOSS SUITE WAS OUTSIDE THE GATE. `vitest.config.ts` excludes `tests/boss/**` because
      # those suites need the workers pool, and no step here ran the other config - so 25 files
      # and 461 tests covering approvals, the airlock, the router, sync, leakage and the vault
      # never ran in CI, while `vitest.boss.config.ts` claimed "Both run under npm run validate."
      # THE POOL'S OWN RACE, RETRIED BY NAME — never a failing assertion. `@cloudflare/vitest-pool-workers`
      # snapshots isolated storage between suites and asserts every file under the D1 directory ends in
      # `.sqlite`; on a slow runner SQLite's WAL sidecar (`…sqlite-shm`) is sometimes still on disk
      # at that instant and the pool aborts the run with "Isolated storage failed" — a message
      # about the harness, not about any test. It hit PR #29 and PR #31 on 21 Sep 2026 on runs whose
      # test failures were 0, and never once locally. So: if the run died on EXACTLY that signature,
      # it is run once more; any other failure is reported as it is. The same shape as the
      # `wrangler dev` retry on the Playwright job below, for the same reason.
      - name: Boss OS suites (workerd, real D1/R2/KV)
        run: |
          npx vitest run --config vitest.boss.config.ts --shard=${{ matrix.shard }}/3 2>&1 | tee boss-suites.log
          rc=${PIPESTATUS[0]}
          # Only the harness's signature, and no real assertion beside it: a test that failed on its
          # own prints "AssertionError: expected …" (or a TypeError/ReferenceError), and that is reported.
          if [ "$rc" -ne 0 ] && grep -q "Isolated storage failed" boss-suites.log \
             && ! grep -qE "AssertionError: expected|TypeError|ReferenceError|Test timed out" boss-suites.log; then
            echo "::warning::the pool's isolated-storage snapshot raced a SQLite WAL sidecar — retrying the Boss suites once"
            npx vitest run --config vitest.boss.config.ts --shard=${{ matrix.shard }}/3
          else
            exit "$rc"
          fi
