# The shared ship-ready baseline (seq23/seq-bin, row 18): renders what ship-ready.json lists and
# fails on the automatic fails. `land` refuses a PR whose ship-ready-baseline check is red.
name: ship-ready-baseline
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
# One baseline per ref: a newer push to the same branch or PR cancels the older run (22 Nov 2026: two
# runs per push were queuing on the same sha).
concurrency:
  group: ship-ready-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ship-ready-baseline:
    uses: seq23/seq-bin/.github/workflows/ship-ready-baseline.yml@v1
