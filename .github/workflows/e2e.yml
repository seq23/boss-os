# Boss OS — the Playwright journeys, ON DEMAND ONLY. Never per merge, never on a schedule.
#
# BUILD FIRST, TEST IN BATCHES. This suite runs only when dispatched by a person, by
# `land --promote boss-os --run-e2e`, or by `land` after a large change (`land` dispatches it when
# the PR it just merged is large; the `land` PR in seq23/seq-bin defines "large"). The merge gate
# is ci.yml. After a LARGE change production deploys only from a commit this workflow has passed
# on: `deploy.yml` fires on THIS workflow's success and ships exactly the sha it passed on;
# `land --promote boss-os` can also ship the newest already-green commit. A SMALL change ships on
# the fast check without this suite (owner, 2 Oct 2026; `land <pr>` deploys it,
# scripts/deploy/production-gate.mjs is the rule).
#
# WHY NOT PER MERGE (26 Sep 2026): 217 journeys on one worker against one shared local D1 take
# 15–17 minutes, and from 21 Sep they ran on `main` after every merge inside `CI`, so every merge
# paid that wait before `Deploy` would fire. The merge gate is `ci.yml` alone (3–4 min).
#
# ON DEMAND ONLY (owner, 2 Oct 2026). Supersedes the weekly Sunday 08:00 UTC schedule of 26 Sep
# 2026: no cron at all, so a scheduled run never spends this private repo's Actions minutes on a
# head nobody changed. A run happens because someone, or `land`, asked for one.
#
# A red run deploys nothing, blocks every small change until a green run is newer (known red), and
# is fixed first: bisect between the last green sha (`gh run list --workflow e2e --status
# success`) and the red one.
#
# NOT `schedule`, NOT `pull_request`, NOT `push`: scripts/validate/the-merge-gate-is-fast.mjs
# fails the build if any of those triggers comes back (any cron, at any cadence), if
# `workflow_dispatch` goes, or if `ci.yml` grows a Playwright step again.
name: e2e

on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright journeys
    runs-on: ubuntu-latest
    # Normal: ~15–17 min (runs 36151769145, 36146807613: 14m44s, 17m28s). 60 is a fault
    # detector at ~4x normal, never a budget; the whole-suite retry below is inside it.
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (reproducible, from package-lock)
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # `npm run e2e` resets the local D1 and starts its own `wrangler dev --local` — offline,
      # no credentials, safe to re-run back to back (AGENTS.md: "that is a hard requirement, not
      # a nicety"). The retry here is for `wrangler dev` itself, not for a failing assertion:
      # observed twice on GitHub's Linux runners, never on macOS — `workerd` throws an internal,
      # message-less error ("please create an issue at workers-sdk") and either drops the server
      # outright or serves a stretch of requests before dying later, taking down every test after
      # it with ECONNREFUSED. Neither occurrence traced to a real test failure once the retry ran
      # clean. A single retry re-runs the WHOLE command, which is what actually resets state
      # safely here — Playwright's own per-test retry would replay a test against a database a
      # crashed server already half-mutated, which is unsafe for this suite's single shared D1
      # (see playwright.config.ts). A journey that fails on its own merits fails the step: this
      # tolerates the tool crashing, never a wrong assertion.
      - name: Playwright journeys
        run: npm run e2e || (echo "::warning::wrangler dev crashed or a journey failed — retrying the whole suite once" && npm run e2e)

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
