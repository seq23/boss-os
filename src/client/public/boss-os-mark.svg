<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="t d">
  <title id="t">Boss OS</title>
  <desc id="d">A light pink briefcase on warm ink: a rounded case with a handle above it, split by a darker band across the middle with a clasp at its centre.</desc>
  <!--
    BOSS OS'S MARK — A LIGHT PINK BRIEFCASE. Her instruction, 13 September 2026:

      "what is this Boss OS logo in the tab? maybe make it a light pink briefcase logo"

    WHAT IT REPLACES, AND WHAT IT DOES NOT. This file previously held the LANE RAIL — a gold bar on
    warm ink with a lit reading gauge — which itself replaced the West Peek WP monogram that had been
    sitting in the tab of her own OS since the repository was cloned. The rail was a good mark and she
    asked for a different one, which is the end of that argument. What has NOT changed is the thing
    the rail fix was really about: `icon.svg` and `boss-mark.svg` in this directory are still West
    Peek's WP monogram, still used by the CHASSIS app under `src/client/` (App.tsx, AuthSurfaces.tsx),
    and they stay exactly where they are. Two businesses, two marks, and `validate:identity` fails the
    build if a Boss OS surface ever points at one of theirs.

    ─── WHY A BRIEFCASE SURVIVES 16 PIXELS ─────────────────────────────────────

    A favicon is read at about the size of a full stop, so the SILHOUETTE has to carry it. A briefcase
    is one of the few objects with a silhouette that is unmistakable at that size: a wide rounded
    rectangle with a small handle on top is not a shape anything else in a tab strip makes. Every
    decision below follows from that and from nothing else:

      · ONE BODY, ONE HANDLE, ONE BAND. No stitching, no corner hardware, no gradient. At 16px the
        whole mark is roughly ten device pixels tall, so a detail smaller than a tenth of the canvas
        is not small — it is absent, and it costs contrast on the way out.
      · THE HANDLE IS A 10px STROKE on a 160px canvas — a full pixel at favicon size, which holds.
        The obvious drawing uses a 4–6px stroke and looks correct at 512 and disappears at 16.
      · THE BAND IS DARK ON PINK, NOT PINK ON PINK. A tonal split would be the first thing lost to
        antialiasing. Ink through the case reads as a division at any size.
      · THE CLASP IS A BLOCK, NOT A CIRCLE. Same lesson the rail's gauge recorded: a small circle
        turns to mud below about 32px, where a rectangle keeps an edge.

    ─── COLOUR ─────────────────────────────────────────────────────────────────

    Light pink #f3b6c6 on warm ink #3d2f33. The ink is Boss OS's own ink token from
    `src/client/boss/styles.css` and the tile is opaque rather than transparent FOR THE SAME REASON
    THE RAIL'S WAS: the mark carries its own ground, so it never dissolves into whatever the browser
    puts behind it. Light pink on a light tab bar would vanish; pink on ink holds in both directions.

    Nothing here is West Peek's #f05a1a, and nothing here is a letterform.

    ─── CHECKED BY LOOKING ─────────────────────────────────────────────────────

    Rendered to PNG at 16, 32, 180 and 512 and inspected, which is the only way a 16-pixel decision
    can be made. `boss-os-32.png`, `boss-os-180.png`, `boss-os-192.png` and `boss-os-512.png` are all
    regenerated from THIS file by `scripts/ops/render-mark.mjs` — a favicon change that updates the
    SVG and leaves stale PNGs behind is the classic version of this bug, and it looks broken rather
    than changed because different surfaces ask for different sizes.
  -->
  <rect width="160" height="160" rx="36" fill="#3d2f33"/>

  <!--
    THE HANDLE, DRAWN FIRST SO THE CASE OVERLAPS ITS FEET.
    An open-bottomed arch: the case body covers where it would end, which is how a real handle reads
    and costs no extra geometry.
  -->
  <path d="M62 56 V44 a18 18 0 0 1 36 0 V56"
        fill="none" stroke="#f3b6c6" stroke-width="10" stroke-linecap="round"/>

  <!-- The case. Wide, low, generously rounded — the shape doing all the work at 16px. -->
  <rect x="24" y="56" width="112" height="80" rx="14" fill="#f3b6c6"/>

  <!-- The divide across the middle, in the tile's own ink so it reads as a gap rather than a line. -->
  <rect x="24" y="88" width="112" height="12" fill="#3d2f33"/>

  <!-- The clasp. A block, not a circle: a circle this size turns to mud below 32 pixels. -->
  <rect x="70" y="84" width="20" height="20" rx="4" fill="#f3b6c6"/>
</svg>
