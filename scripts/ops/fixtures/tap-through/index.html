<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fixture app</title>
<style>body{font:16px system-ui;margin:0;padding:24px}button{display:block;margin:12px 0;padding:12px 16px;font:inherit}
@media (prefers-color-scheme:dark){body{background:#111;color:#eee}}</style></head>
<body><main id="app"></main>
<script>
// A tiny app the tap-through self-test drives. ?broken=1 turns on the planted defects.
const broken = new URLSearchParams(location.search).has("broken");
if (broken) console.error("planted: the broken fixture logs an error on load");
const screens = {
  "": () => `<h1>Fixture app</h1><p>Keep your proof in one place.</p>
    <button data-go="task">Start</button><button data-go="plans">See plans</button>
    <button data-go="settings">Settings</button>${broken ? '<button id="help">Help</button>' : '<button data-go="help">Help</button>'}
    <div role="radiogroup" aria-label="Look"><button role="radio" aria-checked="true">Light look, chosen</button></div>
    <button data-go="saved">Open the proof you saved last, with its photos, its receipt, its notes and the date it was taken, so you can show it to anyone who asks</button>
    <nav role="tablist"><button role="tab" aria-selected="true">Home, current tab</button><button role="tab" aria-selected="false" data-go="plans">Plans tab</button></nav>`,
  task: () => `<h1>New proof</h1><label>Title <input aria-label="Title"></label><button data-go="saved">Save</button><button data-go="">Back home</button>`,
  saved: () => `<h1>Saved</h1><p>Your proof is kept.</p><button data-go="">Done</button>`,
  plans: () => `<h1>Plans</h1><ul><li>Unlimited proofs</li><li>Export to PDF</li>${broken ? "<li>Voice notes</li>" : ""}</ul>
    <button data-go="export">Try export</button>${broken ? "" : '<button data-go="restore">Restore purchase</button>'}<button data-go="">Not now</button>`,
  export: () => `<h1>Export to PDF</h1><p>Preview of your export.</p><button data-go="plans">Back to plans</button>`,
  restore: () => `<h1>Restore</h1><p>Nothing to restore (preview).</p><button data-go="">Done</button>`,
  settings: () => `<h1>Settings</h1><button role="switch" aria-checked="false" id="dm">Reminders</button><button data-go="delete">Delete my data</button><button data-go="">Back home</button>`,
  delete: () => `<h1>Delete my data</h1><p>This removes everything.</p><button id="del">Delete everything</button><button data-go="settings">Cancel</button>`,
  help: () => `<h1>Help</h1><p>Ask us anything.</p><a href="mailto:help@example.com">Email us</a><button data-go="">Back home</button>`,
};
function draw() { const k = location.hash.replace(/^#\/?/, ""); document.getElementById("app").innerHTML = (screens[k] ?? screens[""])(); }
addEventListener("hashchange", draw);
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  // "Start" blanks the screen for a moment first, like a real app's transition: never a blank-screen failure.
  if (b.dataset.go === "task") { document.getElementById("app").innerHTML = ""; setTimeout(() => { location.hash = "/task"; }, 600); return; }
  if (b.dataset.go != null) location.hash = "/" + b.dataset.go;
  if (b.id === "dm") b.setAttribute("aria-checked", b.getAttribute("aria-checked") === "true" ? "false" : "true");
  if (b.id === "del") fetch("/api/delete", { method: "POST" }).then(() => { document.getElementById("app").innerHTML = "<h1>Deleted</h1><p>All gone.</p>"; }, () => { document.getElementById("app").innerHTML = "<h1>Deleted</h1><p>All gone (test value).</p>"; });
});
draw();
</script></body></html>
